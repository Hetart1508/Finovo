name: Send scheduled finance reports

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Report month in YYYY-MM format. Leave blank for previous month."
        required: false
        type: string
      force:
        description: "Send again even if a sent log already exists."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  send-monthly-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Finovo monthly report batch
        env:
          FINOVO_API_BASE_URL: ${{ secrets.FINOVO_API_BASE_URL }}
          MONTHLY_REPORT_CRON_SECRET: ${{ secrets.MONTHLY_REPORT_CRON_SECRET }}
          REPORT_MONTH: ${{ inputs.month }}
          FORCE_SEND: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail

          if [ -z "${FINOVO_API_BASE_URL}" ]; then
            echo "FINOVO_API_BASE_URL secret is required, for example https://your-app.onrender.com/api"
            exit 1
          fi

          if [ -z "${MONTHLY_REPORT_CRON_SECRET}" ]; then
            echo "MONTHLY_REPORT_CRON_SECRET secret is required"
            exit 1
          fi

          BODY="{\"force\":${FORCE_SEND}}"
          if [ -n "${REPORT_MONTH}" ]; then
            BODY="{\"month\":\"${REPORT_MONTH}\",\"force\":${FORCE_SEND}}"
          fi

          RESPONSE_FILE="$(mktemp)"
          HTTP_STATUS="$(curl --silent --show-error --output "${RESPONSE_FILE}" --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer ${MONTHLY_REPORT_CRON_SECRET}" \
            --header "Content-Type: application/json" \
            --data "${BODY}" \
            "${FINOVO_API_BASE_URL%/}/admin/monthly-reports/send")"
          RESPONSE="$(cat "${RESPONSE_FILE}")"

          echo "HTTP status: ${HTTP_STATUS}"
          echo "Response bytes: $(wc -c < "${RESPONSE_FILE}")"
          echo "${RESPONSE}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "Report endpoint returned HTTP ${HTTP_STATUS}."
            exit 1
          fi

          if ! jq empty "${RESPONSE_FILE}" >/dev/null 2>&1; then
            echo "Report endpoint did not return valid JSON. Check FINOVO_API_BASE_URL points to the backend API URL."
            exit 1
          fi

          FAILED="$(jq -r '.failed // 0' "${RESPONSE_FILE}")"
          SENT="$(jq -r '.sent // 0' "${RESPONSE_FILE}")"
          SKIPPED="$(jq -r '.skipped // 0' "${RESPONSE_FILE}")"

          echo "Report summary: sent=${SENT}, skipped=${SKIPPED}, failed=${FAILED}"

          if [ "${FAILED}" -gt 0 ]; then
            echo "One or more report emails failed. Check the response above and backend logs."
            exit 1
          fi
