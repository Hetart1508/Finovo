services:
  - type: web
    name: finovo-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: true
      - key: SESSION_EXPIRES_IN
        value: 2h
      - key: LOG_LEVEL
        value: info
